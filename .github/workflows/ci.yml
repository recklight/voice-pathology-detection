name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # Windows runners default to PowerShell, which cannot parse the heredoc below and
    # judges a multi-line step by its last command only; bash fails on any line.
    defaults:
      run:
        shell: bash
    env:
      # The Windows code page is cp1252, so Python would fail to print Chinese.
      PYTHONUTF8: "1"
      # Figures are written to files; no display is needed.
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安裝專案
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 檢查 Python 3.10 語法相容性
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          bad = []
          for f in pathlib.Path(".").rglob("*.py"):
              if any(p in f.parts for p in (".venv", "build", "dist", "__pycache__")):
                  continue
              try:
                  ast.parse(f.read_text(encoding="utf-8"), filename=str(f), feature_version=(3, 10))
              except SyntaxError as e:
                  bad.append(f"{f}: {e.msg}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("所有檔案皆相容於 Python 3.10")
          EOF

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q

  oldest-deps:
    name: Oldest supported dependencies (Python 3.10, no extras)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: 安裝最舊的相依版本
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.*" "scipy==1.10.*" "scikit-learn==1.2.*" "pandas==1.5.*" \
            "matplotlib==3.6.*" "pyyaml==6.0.*" "typer==0.12.*" "click==8.1.*" \
            "joblib==1.2.*" "openpyxl==3.1.*" "speechdsp==0.2.*" "pytest==7.2.*"
          pip install -e . --no-deps
      - name: Pytest（PyTorch 的測試會自動略過）
        run: python -m pytest -q
