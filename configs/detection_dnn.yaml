# Stage one: normal versus pathological with a five-layer sigmoid network.
seed: 0

normalization:
  method: cmvn

split:
  n_splits: 5
  seed: 0
  val_fraction: 0.2

detection:
  model:
    name: mlp
    params:
      hidden_layer_sizes: [200, 200, 200, 200, 200]
      max_iter: 30
      batch_size: 90
      learning_rate_init: 0.001
      momentum: 0.5
      early_stopping: true
      validation_fraction: 0.1
  aggregation: mean_proba
  # The operating point is picked on data held out from each training fold.
  # To pin it, set threshold_method: fixed and give the value in threshold.
  threshold_method: youden
  target: 0.9
